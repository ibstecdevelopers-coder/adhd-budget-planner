<!doctype html>
<html lang="en" data-mode="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clear Cents — ADHD Budget Planner</title>
<meta name="description" content="Clear Cents — an ADHD-friendly budget planner app: safe-to-spend, paycheck plan, bills calendar, savings, debt payoff and goals. Works online or offline. No bank connection.">
<meta name="theme-color" content="#f5f1ea">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="/assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Clear Cents">
<style>:root{
  --bg:#f5f1ea;--panel:#fffdf9;--ink:#22302c;--muted:#6a7671;--line:#e5ded2;--soft:#efe8dc;
  --acc:#3f7d6e;--good:#2e8757;--warn:#c27a1c;--bad:#c0463e;
  --acc-soft:color-mix(in srgb,var(--acc) 13%,var(--panel));
  --acc-ink:color-mix(in srgb,var(--acc) 75%,var(--ink));
  --good-soft:color-mix(in srgb,var(--good) 13%,var(--panel));
  --warn-soft:color-mix(in srgb,var(--warn) 15%,var(--panel));
  --bad-soft:color-mix(in srgb,var(--bad) 12%,var(--panel));
  --shadow:0 1px 2px rgba(40,30,20,.05),0 6px 22px rgba(40,30,20,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121816;--panel:#1a2220;--ink:#e6eeeb;--muted:#97a6a0;--line:#2a3532;--soft:#212b28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc-ink)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.money{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums}

/* layout */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 14px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 17px var(--serif)}
.brand b{font-family:var(--serif);font-size:17px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.logbtn{margin:4px 4px 12px;justify-content:center}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-size:14.5px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted)}
.main{padding:28px clamp(16px,3.2vw,44px) 90px;max-width:1180px;width:100%}
.top{display:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead p{margin:6px 0 0;color:var(--muted)}
.demo-bar{background:#22302c;color:#f5f1ea;--bg:#f5f1ea;font-size:13.5px;padding:9px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.demo-bar a{color:var(--bg);font-weight:700}
.demo-bar button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:12.5px}

/* cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>h3,.cardhead{margin-bottom:12px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cardhead h2,.cardhead h3{margin:0}
.kpi{padding:16px 18px}
.kpi .label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .val{font-family:var(--serif);font-size:28px;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,var(--line))}
.kpi.acc{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 25%,var(--line))}
.kpi.warn{background:var(--warn-soft)}
.kpi.bad{background:var(--bad-soft)}
.hero-safe{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero-safe .big{font-family:var(--serif);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.link{background:none;border:0;padding:2px 4px;color:var(--muted);cursor:pointer;font-size:13px}
.link:hover{color:var(--acc-ink);text-decoration:underline}
.link.del:hover{color:var(--bad)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.months button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.months button.now:not(.on){border-color:var(--acc)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted)}
.li .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;padding:0}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.chk svg{width:14px;height:14px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);white-space:nowrap}
.pill-ns{background:var(--soft);color:var(--muted)}
.pill-ip{background:var(--warn-soft);color:var(--warn)}
.pill-dn{background:var(--good-soft);color:var(--good)}
.pill{cursor:pointer;border:0}
.date{font-size:12.5px;color:var(--muted);width:58px;flex:none}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:17px;margin-bottom:4px}

/* bars */
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.bar.thick{height:14px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack>i{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.bva .li{display:grid;grid-template-columns:150px 1fr 150px;gap:12px}
.bva .li .bar{height:12px}
.bva .over>i{background:var(--bad)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl input{padding:6px 9px;font-size:14px}
.tblwrap{overflow-x:auto}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .day{min-height:84px;border:1px solid var(--line);border-radius:12px;padding:6px 7px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;font-size:12px;overflow:hidden}
.cal .day:hover{border-color:var(--acc)}
.cal .day.blank{background:transparent;border-style:dashed;opacity:.35;cursor:default}
.cal .day.today{border:2px solid var(--acc)}
.cal .day .n{font-weight:600;font-size:13px}
.cal .ev{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;line-height:1.25}
.cal .ev.paid{opacity:.5;text-decoration:line-through}
.cal .more{font-size:11px;color:var(--muted)}

/* donut */
.donutwrap{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
.donut text{font-family:var(--serif);fill:var(--ink)}

/* steps */
.steps .li{gap:14px}
.stepn{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.stepn.done{background:var(--good);color:#fff}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,18,.42);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal{background:var(--panel);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(480px,100%);max-height:92vh;overflow:auto;padding:22px}
.modal h2{margin-bottom:14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;box-shadow:var(--shadow);animation:fade .2s}
.fab{display:none}
.mcat{display:none}
.li .s:empty{display:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.callout{background:var(--acc-soft);border-radius:14px;padding:14px 16px;font-size:14px}
.callout.warn{background:var(--warn-soft)}
.afford-res{margin-top:10px;font-size:14px;border-radius:12px;padding:10px 12px}
.ns-days{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.ns-days i{width:16px;height:16px;border-radius:5px;background:var(--soft);display:block}
.ns-days i.on{background:var(--good)}
.ns-days i.td{outline:2px solid var(--acc);outline-offset:1px}

@media (max-width:1050px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-7-5,.g3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .shell.open .side{transform:none}
  .shell.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .top b{font-family:var(--serif);font-size:17px}
  .main{padding:18px 16px 100px}
  h1{font-size:25px}
  .g2{grid-template-columns:1fr}
  .donutwrap{grid-template-columns:1fr;justify-items:center}
  .bva .li{grid-template-columns:1fr 110px;row-gap:6px}
  .bva .li .bar{grid-column:1/-1;grid-row:2}
  .cal{gap:3px}
  .cal .day{min-height:58px;padding:4px;border-radius:9px}
  .cal .ev span.lbl{display:none}
  .cal .ev{gap:0}
  .fab{display:inline-flex;position:fixed;right:18px;bottom:20px;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:13px 20px;font-size:15px}
  .hero-safe .big{font-size:38px}
  .frow{grid-template-columns:1fr}
  .months{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .months::-webkit-scrollbar{display:none}
  .li{gap:9px}
  .li>.dot,.li .cattag,.li .rep{display:none}
  .mcat{display:inline}
  .li .date{width:46px}
  .li .t{font-size:14.5px}
  .demo-bar{font-size:12.5px;padding:7px 12px}
}
@media (max-width:460px){.g4{grid-template-columns:1fr 1fr}.kpi .val{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.top,.fab,.demo-bar{display:none!important}.shell{display:block}}
</style>
</head>

<noscript><p style="padding:24px;font-family:sans-serif">Clear Cents needs JavaScript turned on to run.</p></noscript>
<script>(() => {
'use strict';
const MODE = document.documentElement.dataset.mode || 'app'; // demo | app | offline
const KEY = 'clearcents:' + (MODE === 'demo' ? 'demo' : 'main') + ':v1';
const ETSY = 'https://www.etsy.com/shop/worldtradenet';

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const ymOf = s => s.slice(0, 7);
const thisYM = () => today().slice(0, 7);
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (ym, n) => { const d = parse(ym + '-01'); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const monthName = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const shortDate = s => MON[+s.slice(5, 7) - 1] + ' ' + (+s.slice(8, 10));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (a, f = x => x) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const CURRENCIES = [['USD','US Dollar'],['GBP','British Pound'],['EUR','Euro'],['CAD','Canadian Dollar'],['AUD','Australian Dollar'],['NZD','New Zealand Dollar'],['INR','Indian Rupee'],['PKR','Pakistani Rupee'],['AED','UAE Dirham'],['SGD','Singapore Dollar'],['ZAR','South African Rand'],['JPY','Japanese Yen'],['MXN','Mexican Peso'],['PHP','Philippine Peso'],['NGN','Nigerian Naira']];
const ACCENTS = [['Sage','#3f7d6e'],['Lavender','#7a68b8'],['Clay','#b8673f'],['Ocean','#2f6f9f'],['Rose','#b8506e'],['Forest','#3e7a3a'],['Charcoal','#4a5560']];
const PALETTE = ['#3f7d6e','#d08a3c','#6f8fc8','#c25d6e','#8a6fbf','#5aa07a','#d4b04a','#4fa3a6','#b47a5a','#7c8a95','#e07a5f','#9bb06a','#a55b9c','#5f7fa8','#c99a6b'];

let fmtCache = {};
const money = (v, opt = {}) => {
  const c = S.settings.currency;
  const k = c + (opt.round ? 'r' : '');
  if (!fmtCache[k]) {
    try { fmtCache[k] = new Intl.NumberFormat(undefined, { style: 'currency', currency: c, maximumFractionDigits: opt.round ? 0 : 2, minimumFractionDigits: opt.round ? 0 : 2 }); }
    catch { fmtCache[k] = { format: n => c + ' ' + n.toFixed(2) }; }
  }
  return fmtCache[k].format(v || 0);
};

/* ---------- icons ---------- */
const P = {
  today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',

  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  env:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  save:'<path d="M19 9c0-3-3-5-7-5S4 6 4 10c0 2 1 3.5 2.5 4.5L6 18h3l.5-1.5h4L14 18h3l.5-3c1-.5 2-1.5 2-3h1.5V9z"/><path d="M15 9h.01"/>',
  debt:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',

/* ---------- calendar engine ---------- */
function occurrences(e, ym) {
  const out = []; const start = e.date; const last = ym + '-' + pad(daysIn(ym));
  if (start > last) return out;
  if (e.until && e.until < ym + '-01') return out;
  const add = d => { if (ymOf(d) === ym && d >= start && (!e.until || d <= e.until)) out.push(d); };
  if (e.repeat === 'monthly') { const day = Math.min(+start.slice(8, 10), daysIn(ym)); add(ym + '-' + pad(day)); }
  else if (e.repeat === 'weekly' || e.repeat === 'biweekly') {
    const step = e.repeat === 'weekly' ? 7 : 14; const d0 = parse(start); const first = parse(ym + '-01');
    let k = Math.max(0, Math.floor((first - d0) / 864e5 / step) - 1); let d = new Date(d0); d.setDate(d0.getDate() + k * step);
    while (iso(d) <= last) { add(iso(d)); d.setDate(d.getDate() + step); }
  } else if (e.repeat === 'yearly') { if (start.slice(5, 7) === ym.slice(5, 7)) add(ym + start.slice(7)); }
  else add(start);
  return out;
}
function monthEvents(ym) {
  const list = [];
  for (const e of S.events) for (const d of occurrences(e, ym)) list.push({ e, date: d, paid: !!e.paid[d] });
  return list.sort((a, b) => a.date.localeCompare(b.date) || (a.e.kind === 'payday' ? -1 : 1));
}
function markPaid(e, d, on, st = S, silent) {
  e.paid = e.paid || {};
  const src = e.id + '@' + d;
  if (on) {
    e.paid[d] = true;
    if (e.kind === 'note' || !e.amount) return;
    if (st.tx.some(t => t.src === src)) return;
    const t = { id: uid(), date: d, name: e.title, amount: +e.amount, note: '', src };
    if (e.kind === 'payday') t.type = 'income';
    else if (e.fundId) { t.type = 'saving'; t.fundId = e.fundId; const f = st.funds.find(x => x.id === e.fundId); if (f) f.saved += +e.amount; }
    else if (e.debtId) { t.type = 'debt'; t.debtId = e.debtId; const db = st.debts.find(x => x.id === e.debtId); if (db) db.balance = Math.max(0, db.balance - e.amount); }
    else { t.type = 'expense'; t.catId = e.catId || (st.categories.find(c => c.name === 'Miscellaneous') || st.categories[0]).id; }
    if (!silent || d <= today()) st.tx.push(t);

}
function removeTx(t, st = S) { applyTx(t, -1, st); st.tx = st.tx.filter(x => x !== t); if (t.src) { const [eid, d] = t.src.split('@'); const e = st.events.find(x => x.id === eid); if (e) delete e.paid[d]; } }

/* ---------- money math ---------- */
function monthData(ym) {
  const m = S.months[ym] || {};
  const txs = S.tx.filter(t => ymOf(t.date) === ym);
  const received = sum(txs.filter(t => t.type === 'income'), t => t.amount);
  const evs = monthEvents(ym);
  const paydayExpected = sum(evs.filter(x => x.e.kind === 'payday'), x => x.e.amount);
  const planned = m.incomePlan || paydayExpected;
  const unpaidPaydays = sum(evs.filter(x => x.e.kind === 'payday' && !x.paid), x => x.e.amount);
  const income = Math.max(planned, received + unpaidPaydays, received);
  const expense = sum(txs.filter(t => t.type === 'expense'), t => t.amount);
  const saving = sum(txs.filter(t => t.type === 'saving'), t => t.amount);
  const debtPaid = sum(txs.filter(t => t.type === 'debt'), t => t.amount);
  const spent = expense + saving + debtPaid;
  const upcoming = evs.filter(x => !x.paid && x.e.kind !== 'payday' && x.e.kind !== 'note' && x.e.amount > 0);
  const upcomingTotal = sum(upcoming, x => x.e.amount);
  const safe = income - spent - upcomingTotal;
  const byCat = {};
  for (const t of txs) if (t.type === 'expense') byCat[t.catId] = (byCat[t.catId] || 0) + t.amount;
  const budgets = {}; for (const c of S.categories) budgets[c.id] = (m.budgets && m.budgets[c.id] != null) ? m.budgets[c.id] : c.budget;
  const isCur = ym === thisYM(); const daysLeft = isCur ? daysIn(ym) - new Date().getDate() + 1 : (ym > thisYM() ? daysIn(ym) : 0);

}
function simulate(strategy, extra, rollover = true) {

  const totalMin = sum(ds, d => d.min); let month = 0, totalInt = 0;

    let budget = rollover ? totalMin + extra : 0;

function donut(parts, center, sub) {
  const total = sum(parts, p => p.v); const R = 80, r = 54, cx = 100, cy = 100; let a = -Math.PI / 2; let out = '';

  for (const p of parts) {
    if (!p.v) continue; const frac = p.v / total; const a2 = a + frac * Math.PI * 2 - (frac < 1 ? 0.012 : 0);
    if (frac >= 0.999) { out += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${p.c}" stroke-width="${R - r}"/>`; break; }
    const large = a2 - a > Math.PI ? 1 : 0; const pt = (rad, ang) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)].map(n => n.toFixed(2)).join(' ');
    out += `<path d="M${pt(R, a)} A${R} ${R} 0 ${large} 1 ${pt(R, a2)} L${pt(r, a2)} A${r} ${r} 0 ${large} 0 ${pt(r, a)}Z" fill="${p.c}"><title>${esc(p.l)}: ${money(p.v)}</title></path>`;
    a += frac * Math.PI * 2;
  }
  return `<svg class="donut" viewBox="0 0 200 200" width="190" height="190" role="img">${out}<text x="100" y="98" text-anchor="middle" font-size="19">${esc(center)}</text><text x="100" y="118" text-anchor="middle" font-size="11" style="font-family:var(--sans);fill:var(--muted)">${esc(sub)}</text></svg>`;
}
function columns(rows, keys, h = 190) {

function modal(title, body, onSave, opts = {}) {
  const el = document.createElement('div'); el.className = 'scrim';
  el.innerHTML = `<form class="modal" novalidate><h2>${title}</h2>${body}<div class="actions">${opts.del ? '<button type="button" class="btn danger" data-m="del" style="margin-right:auto">Delete</button>' : ''}<button type="button" class="btn" data-m="cancel">Cancel</button><button type="submit" class="btn pri">${opts.ok || 'Save'}</button></div></form>`;
  document.body.appendChild(el);
  const close = () => el.remove(); const form = $('form', el);
  el.addEventListener('mousedown', e => { if (e.target === el) close(); });
  $('[data-m=cancel]', el).onclick = close;
  if (opts.del) $('[data-m=del]', el).onclick = () => { if (confirm('Delete this? This can’t be undone.')) { opts.del(); close(); save(); render(); } };
  form.onsubmit = e => { e.preventDefault(); const fd = Object.fromEntries(new FormData(form)); if (onSave(fd, form) === false) return; close(); save(); render(); };
  if (opts.after) opts.after(form);
  setTimeout(() => { const f = form.querySelector('[autofocus]') || form.querySelector('input,select'); f && f.focus(); }, 30);
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
}

    `<div class="frow">${field('Amount', `<input type="number" name="amount" step="0.01" inputmode="decimal" placeholder="0.00" value="${t.amount}" autofocus required>`)}${field('Date', `<input type="date" name="date" value="${t.date}">`)}</div>` +
    `<div data-for="expense">${field('Category', `<select name="catId">${catOptions(t.catId)}</select>`)}</div>` +
    `<div data-for="saving">${field('Savings fund', S.funds.length ? `<select name="fundId">${S.funds.map(f => `<option value="${f.id}" ${f.id === t.fundId ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>` : '<div class="muted small">Create a savings fund first.</div>')}</div>` +
    `<div data-for="debt">${field('Debt', S.debts.length ? `<select name="debtId">${S.debts.map(d => `<option value="${d.id}" ${d.id === t.debtId ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>` : '<div class="muted small">Add a debt first.</div>')}</div>` +
    field('What was it?', `<input type="text" name="name" placeholder="e.g. Coffee run" value="${esc(t.name)}">`) + field('Notes (optional)', `<input type="text" name="note" placeholder="Anything worth remembering" value="${esc(t.note)}">`),
    fd => {
      const amount = num(fd.amount); if (!amount) { toast('Add an amount first'); return false; }
      if (fd.type === 'saving' && !fd.fundId || fd.type === 'debt' && !fd.debtId) { toast('Pick where it goes first'); return false; }
      if (!isNew) applyTx(t, -1);
      const nt = Object.assign(isNew ? { id: uid() } : t, { type: fd.type, amount, date: fd.date || today(), name: fd.name.trim(), note: fd.note.trim(), catId: fd.type === 'expense' ? fd.catId : undefined, fundId: fd.type === 'saving' ? fd.fundId : undefined, debtId: fd.type === 'debt' ? fd.debtId : undefined });
      applyTx(nt, 1); if (isNew) S.tx.push(nt); toast(isNew ? 'Logged ✓' : 'Saved');
    },
    { ok: isNew ? 'Add' : 'Save', del: isNew ? null : () => removeTx(t), after: form => {
      const sync = () => { const v = form.type.value; form.querySelectorAll('[data-for]').forEach(d => d.style.display = d.dataset.for === v ? '' : 'none'); };
      $('#tt', form).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; form.type.value = b.dataset.v; form.querySelectorAll('#tt button').forEach(x => x.classList.toggle('on', x === b)); sync(); });
      sync();
    } });
}
function eventModal(e, preset = {}) {
  const isNew = !e; e = e || Object.assign({ title: '', kind: 'bill', date: today(), amount: '', repeat: 'monthly', paid: {} }, preset);
  const link = e.fundId ? 'f:' + e.fundId : e.debtId ? 'd:' + e.debtId : e.catId ? 'c:' + e.catId : '';
  modal(isNew ? 'Add to calendar' : 'Edit calendar item',
    `<div class="seg" style="margin-bottom:14px" id="ek">${[['bill', 'Bill'], ['payday', 'Payday'], ['transfer', 'Savings transfer'], ['note', 'Reminder']].map(([v, l]) => `<button type="button" class="${e.kind === v ? 'on' : ''}" data-v="${v}">${l}</button>`).join('')}</div><input type="hidden" name="kind" value="${e.kind}">` +
    field('Name', `<input type="text" name="title" value="${esc(e.title)}" placeholder="e.g. Rent" autofocus>`) +
    `<div class="frow">${field('Date (first time)', `<input type="date" name="date" value="${e.date}">`)}<div data-hide="note">${field('Amount', `<input type="number" name="amount" step="0.01" value="${e.amount}" placeholder="0.00">`)}</div></div>` +
    field('Repeats', `<select name="repeat">${[['none', 'Just once'], ['weekly', 'Every week'], ['biweekly', 'Every 2 weeks'], ['monthly', 'Every month'], ['yearly', 'Every year']].map(([v, l]) => `<option value="${v}" ${e.repeat === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`) +
    `<div data-for="bill">${field('When paid, count it as', `<select name="link_bill"><optgroup label="Spending category">${S.categories.map(c => `<option value="c:${c.id}" ${link === 'c:' + c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>${S.debts.length ? `<optgroup label="Debt payment">${S.debts.map(d => `<option value="d:${d.id}" ${link === 'd:' + d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</optgroup>` : ''}</select>`)}</div>` +
    `<div data-for="transfer">${field('Into savings fund', S.funds.length ? `<select name="link_transfer">${S.funds.map(f => `<option value="f:${f.id}" ${link === 'f:' + f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>` : '<div class="muted small">Create a savings fund first.</div>')}</div>`,
    fd => {
      if (!fd.title.trim()) { toast('Give it a name'); return false; }
      const lk = fd.kind === 'bill' ? fd.link_bill : fd.kind === 'transfer' ? fd.link_transfer : '';
      Object.assign(e, { title: fd.title.trim(), kind: fd.kind, date: fd.date || today(), amount: fd.kind === 'note' ? 0 : num(fd.amount), repeat: fd.repeat, catId: undefined, fundId: undefined, debtId: undefined });
      if (lk) { const [t, id] = lk.split(':'); e[{ c: 'catId', f: 'fundId', d: 'debtId' }[t]] = id; }
      if (isNew) { e.id = uid(); S.events.push(e); }
      toast('Saved to calendar');
    },
    { del: isNew ? null : () => { S.tx.filter(t => t.src && t.src.startsWith(e.id + '@')).forEach(t => { t.src = undefined; }); S.events = S.events.filter(x => x !== e); }, after: form => {
      const sync = () => { const v = form.kind.value; form.querySelectorAll('[data-for]').forEach(d => d.style.display = d.dataset.for === v ? '' : 'none'); form.querySelectorAll('[data-hide]').forEach(d => d.style.display = d.dataset.hide === v ? 'none' : ''); };
      $('#ek', form).addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; form.kind.value = b.dataset.v; form.querySelectorAll('#ek button').forEach(x => x.classList.toggle('on', x === b)); sync(); });
      sync();
    } });
}
const colorField = (sel) => `<div class="swatches" id="cols">${PALETTE.slice(0, 12).map(c => `<button type="button" class="${c === sel ? 'on' : ''}" style="background:${c}" data-v="${c}"></button>`).join('')}</div><input type="hidden" name="color" value="${sel}">`;
const colorWire = form => $('#cols', form).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; form.color.value = b.dataset.v; form.querySelectorAll('#cols button').forEach(x => x.classList.toggle('on', x === b)); });
function fundModal(f) {
  const isNew = !f; f = f || { name: '', saved: 0, target: '', date: '', color: PALETTE[S.funds.length % PALETTE.length] };
  modal(isNew ? 'New savings fund' : 'Edit fund', field('Name', `<input type="text" name="name" value="${esc(f.name)}" placeholder="e.g. Emergency fund" autofocus>`) + `<div class="frow">${field('Saved so far', `<input type="number" name="saved" value="${f.saved}">`)}${field('Target', `<input type="number" name="target" value="${f.target}">`)}</div>` + field('Target date (optional)', `<input type="date" name="date" value="${f.date}">`) + field('Colour', colorField(f.color)),
    fd => { if (!fd.name.trim()) return false; Object.assign(f, { name: fd.name.trim(), saved: num(fd.saved), target: num(fd.target), date: fd.date, color: fd.color }); if (isNew) { f.id = uid(); S.funds.push(f); } },
    { del: isNew ? null : () => { S.funds = S.funds.filter(x => x !== f); }, after: colorWire });
}
function debtModal(d) {
  const isNew = !d; d = d || { name: '', balance: '', original: '', apr: '', min: '', color: PALETTE[(S.debts.length + 3) % PALETTE.length] };
  modal(isNew ? 'New debt' : 'Edit debt', field('Name', `<input type="text" name="name" value="${esc(d.name)}" placeholder="e.g. Visa card" autofocus>`) + `<div class="frow">${field('Balance now', `<input type="number" name="balance" value="${d.balance}">`)}${field('Starting balance (for progress)', `<input type="number" name="original" value="${d.original}">`)}</div><div class="frow">${field('Interest rate (APR %)', `<input type="number" step="0.01" name="apr" value="${d.apr}">`)}${field('Minimum payment / month', `<input type="number" name="min" value="${d.min}">`)}</div>` + field('Colour', colorField(d.color)),
    fd => { if (!fd.name.trim()) return false; Object.assign(d, { name: fd.name.trim(), balance: num(fd.balance), original: num(fd.original) || num(fd.balance), apr: num(fd.apr), min: num(fd.min), color: fd.color }); if (isNew) { d.id = uid(); S.debts.push(d); } },
    { del: isNew ? null : () => { S.debts = S.debts.filter(x => x !== d); }, after: colorWire });
}
function goalModal(g) {
  const isNew = !g; g = g || { title: '', status: 'ns', date: '', note: '' };
  modal(isNew ? 'New goal' : 'Edit goal', field('Goal', `<input type="text" name="title" value="${esc(g.title)}" placeholder="e.g. Pay off the Visa card" autofocus>`) + `<div class="frow">${field('Status', `<select name="status">${[['ns', 'Not started'], ['ip', 'In progress'], ['dn', 'Done']].map(([v, l]) => `<option value="${v}" ${g.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}${field('Target date', `<input type="date" name="date" value="${g.date}">`)}</div>` + field('Note', `<input type="text" name="note" value="${esc(g.note)}" placeholder="Why it matters, or the next step">`),
    fd => { if (!fd.title.trim()) return false; Object.assign(g, { title: fd.title.trim(), status: fd.status, date: fd.date, note: fd.note.trim() }); if (isNew) { g.id = uid(); S.goals.push(g); } },
    { del: isNew ? null : () => { S.goals = S.goals.filter(x => x !== g); } });
}
function catModal(c) {
  const isNew = !c; c = c || { name: '', group: 'wants', budget: '', color: PALETTE[S.categories.length % PALETTE.length] };
  modal(isNew ? 'New category' : 'Edit category', field('Name', `<input type="text" name="name" value="${esc(c.name)}" autofocus>`) + `<div class="frow">${field('Type', `<select name="group"><option value="needs" ${c.group === 'needs' ? 'selected' : ''}>Need</option><option value="wants" ${c.group === 'wants' ? 'selected' : ''}>Want</option></select>`)}${field('Default monthly budget', `<input type="number" name="budget" value="${c.budget}">`)}</div>` + field('Colour', colorField(c.color)),
    fd => { if (!fd.name.trim()) return false; Object.assign(c, { name: fd.name.trim(), group: fd.group, budget: num(fd.budget), color: fd.color }); if (isNew) { c.id = 'c' + uid(); S.categories.push(c); } },
    { del: isNew || S.categories.length < 2 ? null : () => { if (S.tx.some(t => t.catId === c.id)) { const misc = S.categories.find(x => x !== c); S.tx.forEach(t => { if (t.catId === c.id) t.catId = misc.id; }); } S.categories = S.categories.filter(x => x !== c); }, after: colorWire });
}
function quickMoney(title, label, onOk) { modal(title, field(label, '<input type="number" name="v" step="0.01" autofocus>') + field('Date', `<input type="date" name="d" value="${today()}">`), fd => { const v = num(fd.v); if (!v) return false; onOk(v, fd.d || today()); }, { ok: 'Add' }); }

/* ---------- utilities ---------- */
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function csv() {
  const rows = [['Date', 'Type', 'Category / Fund / Debt', 'Name', 'Amount', 'Notes']];
  S.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, t.type, t.type === 'expense' ? cat(t.catId)?.name : t.type === 'saving' ? fund(t.fundId)?.name : t.type === 'debt' ? debt(t.debtId)?.name : 'Income', t.name, t.amount.toFixed(2), t.note]));
  download('clear-cents-transactions-' + today() + '.csv', rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv');
}
let toastT; function toast(msg) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }

/* ---------- events ---------- */
function onClick(ev) {
  const nav = ev.target.closest('a[data-view]'); if (nav) { ev.preventDefault(); go(nav.dataset.view); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  const acts = {
    log: () => txModal(), tx: () => txModal(S.tx.find(t => t.id === id)),
    menu: () => $('#shell').classList.toggle('open'),
    theme: () => { const dark = document.documentElement.dataset.theme === 'dark'; S.settings.theme = dark ? 'light' : 'dark'; save(); render(); },
    go: () => go(v), vym: () => { viewYM = v; render(); }, cym: () => { calYM = v; render(); }, openmonth: () => { viewYM = v; go('month'); },
    event: () => id ? eventModal(S.events.find(e => e.id === id)) : eventModal(null, b.dataset.kind ? { kind: b.dataset.kind, title: b.dataset.kind === 'payday' ? 'Paycheck' : '' } : {}),
    newevent: () => eventModal(null, { date: b.dataset.d, repeat: 'none' }),
    paid: () => { const e = S.events.find(x => x.id === id); const d = b.dataset.d; markPaid(e, d, !e.paid[d]); save(); render(); toast(e.paid[d] ? (e.kind === 'payday' ? 'Payday recorded 💸' : 'Marked paid ✓') : 'Unmarked'); },
    income: () => modal('Expected income — ' + monthName(viewYM), field('How much do you expect to bring in this month?', `<input type="number" name="v" value="${(S.months[viewYM] || {}).incomePlan || ''}" autofocus>`) + '<p class="muted small" style="margin-top:-4px">Leave empty to use the paydays on your calendar.</p>', fd => { (S.months[viewYM] ||= { budgets: {} }).incomePlan = num(fd.v); }),
    fund: () => fundModal(fund(id)), debt: () => debtModal(debt(id)), goal: () => goalModal(S.goals.find(g => g.id === id)), cat: () => catModal(cat(id)),
    addmoney: () => { const f = fund(id); quickMoney('Add to ' + f.name, 'Amount to add', (amt, d) => { const t = { id: uid(), type: 'saving', fundId: f.id, amount: amt, date: d, name: 'Transfer to ' + f.name, note: '' }; S.tx.push(t); applyTx(t, 1); toast('Added to ' + f.name); }); },
    paydebt: () => { const d = debt(id); quickMoney('Payment to ' + d.name, 'Payment amount', (amt, dt) => { const t = { id: uid(), type: 'debt', debtId: d.id, amount: amt, date: dt, name: d.name + ' payment', note: '' }; S.tx.push(t); applyTx(t, 1); toast('Payment recorded'); }); },
    strat: () => { S.debtPlan.strategy = v; save(); render(); },
    cycle: () => { const g = S.goals.find(x => x.id === id); g.status = { ns: 'ip', ip: 'dn', dn: 'ns' }[g.status]; save(); render(); },
    nospend: () => { const t = today(); if (S.nospend[t]) delete S.nospend[t]; else { S.nospend[t] = true; toast('Nice! No-spend day logged 🌱'); } save(); render(); },
    settheme: () => { S.settings.theme = v; save(); render(); }, accent: () => { S.settings.accent = v; save(); render(); },
    backup: () => { download('clear-cents-backup-' + today() + '.json', JSON.stringify(S, null, 1), 'application/json'); toast('Backup downloaded'); },
    restore: () => $('#restorefile').click(), csv: () => csv(),
    sample: () => { if (confirm('Replace your planner with sample data? (Download a backup first if you want to keep yours.)')) { S = sampleState(); fmtCache = {}; save(); render(); } },
    wipe: () => { if (confirm('Erase everything in this planner? This can’t be undone.')) { S = blankState(); save(); go('start'); } },
    'demo-reset': () => { S = sampleState(); fmtCache = {}; save(); render(); toast('Demo reset'); },
  };
  if (acts[a]) { ev.preventDefault(); acts[a](); }
}

/* ---------- boot ---------- */
load(); shell();
document.addEventListener('click', onClick);
const fromHash = () => { const h = location.hash.slice(1); if (VIEWS[h]) { view = h; render(); } };
window.addEventListener('hashchange', fromHash);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.settings.theme === 'auto' && applyTheme());
const h0 = location.hash.slice(1); view = VIEWS[h0] ? h0 : (MODE !== 'demo' && !S.tx.length && !S.events.length ? 'start' : 'today');
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && MODE !== 'offline') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__cc = { get S() { return S; }, go };
})();
</script>
